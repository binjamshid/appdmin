name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task verify
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-compose-only
          APPDMIN_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      - run: sudo ln -sf "$(command -v deno)" /usr/bin/deno
      - run: systemd-analyze verify deploy/appdmin.service
      - run: docker build -t appdmin:test .
